[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsletter-autopilot"
version = "0.1.0"
description = "A daily newsletter that drafts, renders, schedules and verifies itself, at most once."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["newsletter", "publishing", "idempotency", "at-most-once", "automation"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Topic :: Communications :: Email",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
autopilot = "newsletter_autopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
